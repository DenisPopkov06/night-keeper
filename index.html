<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Night Keeper</title>
    <link rel="icon" href="icons/favicon.ico" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #app-canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app-canvas"></canvas>
    <div id="ui-root"></div>
    <!-- Yandex Games SDK v2: на площадке этот скрипт подставляется окружением,
         но по документации его нужно подключать явно и для продакшен-сборки.
         В dev-режиме (localhost) домен недоступен, YandexSDK.ts обрабатывает это сам. -->
    <script src="https://yandex.ru/games/sdk/v2"></script>
    <script type="module" src="/src/main.ts"></script>
    <!-- Vite entry: index.html стоит в корне репозитория, т.к. этого требует сборщик;
         после vite build файл окажется в корне dist/, что и требуется для Яндекс Игр. -->

  </body>
</html>
